version: '3.8'

services:
  davomat:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile
    command: >
      bash -c "
        python3 manage.py migrate &&
        python3 manage.py collectstatic --noinput &&
        gunicorn -w 4 --timeout 300 -b 0.0.0.0:8000 davomat.wsgi
      "
    volumes:
      - .:/app
    ports:
      - "3012:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      - OSRM_URL=http://osrm:5000
    depends_on:
      - osrm
    restart: always

  # Ko'cha nomi uchun OSRM (xarita: deploy/osrm-prepare.sh bilan tayyorlanadi)
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: osrm-routed --algorithm mld /data/uzbekistan-latest.osrm
    volumes:
      - ../osrm-data:/data:ro
    restart: always

  bot:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile
    command: python3 bot/run.py
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    restart: always
