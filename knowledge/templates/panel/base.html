{% load static %}
<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Билим панели{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f7fb; --bg2: #eef0f7; --panel: #ffffff; --panel2: #fbfcfe;
            --text: #141a2e; --muted: #747d95; --faint: #9aa2b8;
            --border: #e9ebf3; --border2: #eef0f6;
            --accent: #6366f1; --accent2: #8b5cf6; --accent-weak: #eef0ff;
            --grad: linear-gradient(135deg,#6366f1,#8b5cf6);
            --grad-green: linear-gradient(135deg,#16a34a,#22c55e);
            --green: #16a34a; --green-weak: #e7f7ee; --red: #e11d48; --red-weak: #fdeaef;
            --amber: #d97706; --amber-weak: #fdf3e4; --blue: #2563eb; --blue-weak: #e8f0ff;
            --shadow-sm: 0 1px 2px rgba(20,26,46,.06);
            --shadow: 0 4px 16px -4px rgba(20,26,46,.10), 0 2px 6px -2px rgba(20,26,46,.06);
            --shadow-lg: 0 18px 40px -12px rgba(30,30,80,.22);
            --r: 16px;
        }
        html[data-theme="dark"] {
            --bg: #0b0f1a; --bg2: #0f1422; --panel: #141a28; --panel2: #171e2e;
            --text: #e9edf6; --muted: #8b95ac; --faint: #69728c;
            --border: #232c40; --border2: #1b2336;
            --accent: #818cf8; --accent2: #a78bfa; --accent-weak: #1b2340;
            --grad: linear-gradient(135deg,#6366f1,#8b5cf6);
            --green: #34d399; --green-weak: #0f2a1e; --red: #fb7185; --red-weak: #35141f;
            --amber: #fbbf24; --amber-weak: #332610; --blue: #60a5fa; --blue-weak: #142138;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
            --shadow: 0 6px 20px -6px rgba(0,0,0,.5); --shadow-lg: 0 20px 44px -12px rgba(0,0,0,.6);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin: 0; font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); display: flex; min-height: 100vh;
            -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
        a { color: inherit; text-decoration: none; }
        ::selection { background: var(--accent); color: #fff; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid var(--panel); }

        /* ---- Sidebar ---- */
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid var(--border);
            padding: 18px 14px; display: flex; flex-direction: column; gap: 3px;
            position: sticky; top: 0; height: 100vh; }
        .brand { display: flex; align-items: center; gap: 11px; padding: 8px 10px 20px; font-weight: 800; font-size: 16px; }
        .brand .logo { width: 36px; height: 36px; border-radius: 11px; background: var(--grad);
            display: grid; place-items: center; font-size: 18px; box-shadow: 0 6px 16px -4px rgba(99,102,241,.6); }
        .nav-label { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase;
            letter-spacing: .09em; padding: 14px 12px 7px; }
        .nav a { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 11px;
            color: var(--muted); font-size: 14px; font-weight: 500; transition: .16s; position: relative; }
        .nav a .ico { font-size: 17px; width: 20px; text-align: center; }
        .nav a:hover { background: var(--bg2); color: var(--text); }
        .nav a.active { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
        .nav a.active::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px;
            width: 3px; border-radius: 0 3px 3px 0; background: var(--grad); }
        .sidebar .bottom { margin-top: auto; }

        /* ---- Main ---- */
        .main { flex: 1; padding: 28px 36px; min-width: 0; }
        .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 26px; gap: 16px; }
        .topbar h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
        .topbar .sub { color: var(--muted); font-size: 14px; margin-top: 3px; }
        .topbar .right { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
        .back { color: var(--muted); font-size: 15px; display: inline-flex; align-items: center; gap: 7px;
            padding: 6px 12px 6px 9px; border-radius: 9px; background: var(--panel); border: 1px solid var(--border); }
        .back:hover { color: var(--text); }

        /* ---- Buttons ---- */
        .btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
            background: var(--panel); color: var(--text); padding: 9px 15px; border-radius: 10px;
            font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; transition: .16s;
            box-shadow: var(--shadow-sm); white-space: nowrap; }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn:active { transform: translateY(0); }
        .btn.primary { background: var(--grad); border: none; color: #fff; box-shadow: 0 8px 18px -6px rgba(99,102,241,.6); }
        .btn.green { background: var(--grad-green); border: none; color: #fff; box-shadow: 0 8px 18px -6px rgba(22,163,74,.55); }
        .btn.ghost { background: transparent; box-shadow: none; }
        .btn.ghost:hover { background: var(--bg2); box-shadow: none; }
        .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: var(--shadow-sm); }

        /* ---- Cards ---- */
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
            padding: 20px; box-shadow: var(--shadow); }
        .card h2, .card .card-title { font-size: 15px; font-weight: 700; margin: 0 0 14px; }
        .grid { display: grid; gap: 16px; }
        .cards3 { grid-template-columns: repeat(3, 1fr); }

        .stat { display: flex; align-items: center; gap: 15px; }
        .stat .chip { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
            font-size: 21px; flex-shrink: 0; }
        .stat .n { font-size: 25px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
        .stat .l { color: var(--muted); font-size: 13px; margin-top: 3px; font-weight: 500; }
        .chip.i-indigo { background: var(--accent-weak); color: var(--accent); }
        .chip.i-green { background: var(--green-weak); color: var(--green); }
        .chip.i-red { background: var(--red-weak); color: var(--red); }
        .chip.i-amber { background: var(--amber-weak); color: var(--amber); }
        .chip.i-blue { background: var(--blue-weak); color: var(--blue); }

        /* ---- Table ---- */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 13px 12px; border-bottom: 1px solid var(--border2); }
        thead th { color: var(--faint); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
        tbody tr { transition: background .14s; }
        tbody tr:hover { background: var(--bg2); }
        tbody tr:last-child td { border-bottom: none; }

        /* ---- Badges ---- */
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 20px;
            font-size: 12px; font-weight: 600; }
        .badge.green { background: var(--green-weak); color: var(--green); }
        .badge.amber { background: var(--amber-weak); color: var(--amber); }
        .badge.red { background: var(--red-weak); color: var(--red); }
        .badge.accent { background: var(--accent-weak); color: var(--accent); }
        .badge.dot::before { content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }

        /* ---- Forms ---- */
        label.field { display: block; margin-bottom: 16px; }
        label.field .lbl { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
        input[type=text], input[type=number], input[type=url], input[type=password], input[type=file], select, textarea {
            width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 11px;
            background: var(--panel2); color: var(--text); font-size: 14px; font-family: inherit; transition: .16s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-weak); background: var(--panel); }
        textarea { resize: vertical; min-height: 96px; line-height: 1.55; }
        input[type=radio], input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
        .row { display: flex; gap: 14px; } .row > * { flex: 1; }
        .muted { color: var(--muted); } .faint { color: var(--faint); }
        .section-label { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase;
            letter-spacing: .08em; margin-bottom: 12px; }

        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: var(--bg);
            padding: 13px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0;
            transform: translateY(12px); transition: .28s cubic-bezier(.2,.8,.2,1); z-index: 60; box-shadow: var(--shadow-lg); }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 820px) {
            .sidebar { display: none; } .main { padding: 18px 16px; } .cards3 { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; }
        }
    </style>
</head>
<body>
    {% if request.user.is_authenticated %}
    <aside class="sidebar">
        <div class="brand"><span class="logo">📚</span> Билим панели</div>
        <div class="nav-label">Меню</div>
        <nav class="nav">
            <a href="/panel/" class="{% block nav_dash %}{% endblock %}"><span class="ico">📊</span> Бош саҳифа</a>
            <a href="/panel/documents/new/" class="{% block nav_new %}{% endblock %}"><span class="ico">➕</span> Янги ҳужжат</a>
        </nav>
        <div class="bottom">
            <div class="nav">
                <a href="#" onclick="toggleTheme();return false"><span class="ico">🌓</span> Кун/тун режими</a>
                <a href="/panel/logout/"><span class="ico">🚪</span> Чиқиш</a>
            </div>
        </div>
    </aside>
    {% endif %}

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <div class="toast" id="toast"></div>
    <script>
        function applyTheme(t) { document.documentElement.setAttribute("data-theme", t);
            try { localStorage.setItem("panel-theme", t); } catch(e){} }
        function toggleTheme() {
            applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
        try { applyTheme(localStorage.getItem("panel-theme") || "light"); } catch(e){}
        function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg;
            t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
        function getCookie(name) {
            const m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)"); return m ? m.pop() : ""; }
        const CSRF = getCookie("csrftoken");
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
